apiVersion: apps/v1
kind: Deployment
metadata:
  name: task15-api
  namespace: task15
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: task15-api
  template:
    metadata:
      labels:
        app: task15-api
    spec:
      containers:
        - name: api
          image: task15-cifar-api:v1
          imagePullPolicy: Never
          env:
            - name: APP_VERSION
              value: "v1"
            - name: MODEL_PATH
              value: "/app/model/cifar10_cnn.pth"
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1536Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 45
            periodSeconds: 20
